<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>SecCorp</title>
    <script src="/boot.js"></script>
    <style>
      #startup-placeholder {
        box-sizing: border-box;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        color: #e7edf7;
        background: radial-gradient(circle at 50% 36%, #172643, #090f1c 72%);
        font: 500 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #startup-placeholder > div { text-align: center; }
      #startup-placeholder strong { display: block; margin-bottom: 8px; font-size: 30px; }
      #startup-placeholder span { color: #94a3b8; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="startup-placeholder" role="status">
        <div><strong>SecCorp</strong><span id="startup-message">Loading…</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
