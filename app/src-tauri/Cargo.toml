[package]
name = "seccom-app"
description = "SecCorp Antivirus"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary (Windows).
# The Android JNI bridge loads it as "seccom_app_lib".
name = "seccom_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["online-update"]
# Download signature updates over HTTPS (ureq + rustls).
online-update = ["dep:ureq"]
# Mac App Store build: sandboxed, user-selected files and folders only.
# The direct-download build keeps whole-disk, real-time and network protection.
mac-app-store = []

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.6"
tauri-plugin-opener = "2.7"
tauri-plugin-os = "2.4"
tauri-plugin-seccom-device = { path = "../../plugins/tauri-plugin-seccom-device" }
seccom-engine = { workspace = true, features = ["realtime"] }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
hex.workspace = true
uuid = { version = "1", features = ["v4"] }
ureq = { version = "3", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
netstat2 = "0.11"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Environment"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
