[workspace]
resolver = "3"
members = [
    "crates/engine",
    "crates/cli",
    "tools/sigtool",
    "plugins/tauri-plugin-seccom-device",
    "app/src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Proprietary"
authors = ["webnetkz"]
rust-version = "1.88"

[workspace.dependencies]
seccom-engine = { path = "crates/engine", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
hex = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
