# Windows build: NSIS installer, MSI and Microsoft Store MSIX for x64
# (+ NSIS and Store MSIX for ARM64).
# Runs on demand or for tags like v1.2.3. Independent from the other platforms.
name: Build Windows

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture"
        type: choice
        options: [x64, arm64, both]
        default: x64
      store_msix:
        description: "Also build the Microsoft Store MSIX"
        type: boolean
        default: false
  push:
    branches: ["codex/microsoft-store-1.0.0"]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Ed25519 public key that signs signature-database updates (hex) and the
      # update.json URL. Both are compiled into the app; leave empty to disable.
      SECCOM_UPDATE_PUBKEY: ${{ vars.SECCOM_UPDATE_PUBKEY }}
      SECCOM_UPDATE_URL: ${{ vars.SECCOM_UPDATE_URL }}
      # Optional code signing command; %1 is replaced with the file to sign.
      SECCOM_WINDOWS_SIGN_COMMAND: ${{ secrets.SECCOM_WINDOWS_SIGN_COMMAND }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: windows

      - name: Test Windows quarantine handling
        shell: pwsh
        run: cargo test -p seccom-engine --lib --target x86_64-pc-windows-msvc quarantine::tests

      - name: Build
        shell: pwsh
        run: |
          if ("${{ inputs.store_msix || contains(github.event.head_commit.message, '[store-msix]') || startsWith(github.ref, 'refs/tags/') }}" -eq "true") {
            ./build/windows/build.ps1 -Arch "${{ inputs.arch || 'x64' }}" -StoreMsix
          } else {
            ./build/windows/build.ps1 -Arch "${{ inputs.arch || 'x64' }}"
          }

      - name: Test packaged launch
        if: inputs.store_msix || contains(github.event.head_commit.message, '[store-msix]') || startsWith(github.ref, 'refs/tags/')
        timeout-minutes: 12
        shell: pwsh
        run: ./build/windows/diagnose-msix.ps1 -ArtifactRoot dist-release/windows/store -OutputDir dist-release/windows/msix-diagnostics

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: seccom-windows
          path: dist-release/windows/
          if-no-files-found: error
