# Checks on every push / pull request: engine tests, lints and the UI build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ci

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: UI build
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Engine, CLI and sigtool tests
        run: cargo test -p seccom-engine -p seccom-cli -p seccom-sigtool

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
