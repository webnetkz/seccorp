name: Diagnose Windows MSIX

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build Windows run containing the Store MSIX"
        required: true
        default: "39201131341"
  push:
    branches: ["codex/microsoft-store-1.0.0"]

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[diagnose-msix]')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: seccom-windows
          path: artifact
          run-id: ${{ inputs.run_id || '39248889055' }}
          github-token: ${{ github.token }}

      - name: Install and launch MSIX
        shell: pwsh
        run: ./build/windows/diagnose-msix.ps1 -ArtifactRoot artifact -OutputDir diagnostics

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: seccom-msix-diagnostics
          path: diagnostics/
          if-no-files-found: warn

